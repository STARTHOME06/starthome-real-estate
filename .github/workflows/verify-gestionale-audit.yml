name: Verify Gestionale sync changes

on:
  push:
    branches:
      - audit/gestionale-image-storage-20261107

permissions:
  contents: read

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tests and sync scripts only
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts
            tests
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Run sync unit tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Verify Python compilation
        run: python -m compileall -q scripts tests
